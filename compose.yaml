# The self-hosted deployment: the server and Garage for file contents.
#   ops/init-env.sh         # writes .env with fresh secrets
#   podman compose up -d --build
# With another S3-compatible store instead (Cloudflare R2, for one), set
# S3_ENDPOINT, S3_REGION, S3_BUCKET and its keys in .env, and start the
# server alone, without Garage:
#   podman compose up -d --build --no-deps kurobako
# The server listens on 127.0.0.1:${PORT}; put a reverse proxy with HTTPS in
# front of it (encrypted namespaces need a secure page).
services:
  kurobako:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-kurobako}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?run ops/init-env.sh, or set your store's keys}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run ops/init-env.sh, or set your store's keys}
      ADMIN_KEY: ${ADMIN_KEY:-}
      ACCESS_KEY: ${ACCESS_KEY:-}
      ACCESS_SESSION_DAYS: ${ACCESS_SESSION_DAYS:-}
      PUBLIC_SHARES: ${PUBLIC_SHARES:-}
      BASE_PATH: ${BASE_PATH:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SENDS_PER_MINUTE: ${SENDS_PER_MINUTE:-}
      MISSES_PER_MINUTE: ${MISSES_PER_MINUTE:-}
      AUTOMATED_NETWORKS: ${AUTOMATED_NETWORKS:-}
      MAX_STORAGE_BYTES: ${MAX_STORAGE_BYTES:-}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-}
      MAX_TEXT_BYTES: ${MAX_TEXT_BYTES:-}
      INLINE_TEXT_BYTES: ${INLINE_TEXT_BYTES:-}
      ITEM_TTL_SECONDS: ${ITEM_TTL_SECONDS:-}
      MAX_ITEMS: ${MAX_ITEMS:-}
      MAX_LIVE_CONNECTIONS: ${MAX_LIVE_CONNECTIONS:-}
      EMPTY_NAMESPACE_TTL_SECONDS: ${EMPTY_NAMESPACE_TTL_SECONDS:-}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-}
      SQLITE_MAX_OPEN: ${SQLITE_MAX_OPEN:-1000}
      SQLITE_IDLE_SECONDS: ${SQLITE_IDLE_SECONDS:-60}
    volumes:
      - kurobako-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/k/healthz"]
      interval: 30s
    depends_on:
      garage:
        condition: service_healthy

  garage:
    build: ops/garage
    restart: unless-stopped
    # Optional here, so that a store other than Garage needs none of it;
    # Garage's own start checks them.
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
      S3_BUCKET: ${S3_BUCKET:-kurobako}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - garage-data:/var/lib/garage
    healthcheck:
      test: ["CMD-SHELL", "garage bucket info \"$$S3_BUCKET\" >/dev/null"]
      interval: 5s
      retries: 30

volumes:
  kurobako-data:
  garage-data:
