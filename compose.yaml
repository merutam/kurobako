# The self-hosted deployment: the server and Garage for file contents.
#   ops/init-env.sh         # writes .env with fresh secrets
#   podman compose up -d --build
# The server listens on 127.0.0.1:${PORT}; put a reverse proxy with HTTPS in
# front of it (encrypted namespaces need a secure page).
services:
  kurobako:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: ${S3_BUCKET:-kurobako}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?run ops/init-env.sh first}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run ops/init-env.sh first}
      ADMIN_KEY: ${ADMIN_KEY:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SENDS_PER_MINUTE: ${SENDS_PER_MINUTE:-30}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-}
      MAX_TEXT_BYTES: ${MAX_TEXT_BYTES:-}
      ITEM_TTL_SECONDS: ${ITEM_TTL_SECONDS:-}
      MAX_ITEMS: ${MAX_ITEMS:-}
      MAX_LIVE_CONNECTIONS: ${MAX_LIVE_CONNECTIONS:-}
      EMPTY_NAMESPACE_TTL_SECONDS: ${EMPTY_NAMESPACE_TTL_SECONDS:-}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-}
    volumes:
      - kurobako-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthz"]
      interval: 30s
    depends_on:
      garage:
        condition: service_healthy

  garage:
    build: ops/garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?run ops/init-env.sh first}
      S3_BUCKET: ${S3_BUCKET:-kurobako}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?run ops/init-env.sh first}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run ops/init-env.sh first}
    volumes:
      - garage-data:/var/lib/garage
    healthcheck:
      test: ["CMD-SHELL", "garage bucket info \"$$S3_BUCKET\" >/dev/null"]
      interval: 5s
      retries: 30

volumes:
  kurobako-data:
  garage-data:
