<head>
  <meta name="robots" content="noindex" />
  <title>Shared view · Kurobako</title>
  <script type="module" src="/view.js"></script>
  <script type="application/json" id="view-data">"%VIEW%"</script>
</head>
<main>
  <h1>Shared view</h1>
  <p class="intro">Read-only. New items appear here while this view is active; existing items stay live after it freezes.</p>
  <p id="view-status" class="status" role="status" aria-live="polite"></p>
  <ol id="view-items" class="stack"></ol>

  <section class="page-section" aria-labelledby="clone-title">
    <h2 id="clone-title">Clone into a new namespace</h2>
    <p class="hint">Copies the items available now. The copy will not follow future changes; interrupted copies may be partial.</p>
    <form id="clone-form" class="stack">
      <label for="clone-mode">Destination</label>
      <select id="clone-mode"><option value="plain">Plain namespace</option><option value="sealed">Encrypted namespace</option></select>
      <label for="clone-name">New namespace name</label>
      <input id="clone-name" type="text" autocomplete="off" required />
      <label class="checkbox-label"><input id="clone-limited" type="checkbox" /> Include read-limited items (each copy consumes one read)</label>
      <p class="actions"><button type="submit" data-icon="copy">Clone</button></p>
    </form>
  </section>
</main>
