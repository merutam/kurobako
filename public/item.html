<head>
  <meta name="robots" content="noindex" />
  <title>Shared item · Kurobako</title>
  <script type="module" src="/item.js"></script>
  <!-- Filled in by the server: the shared item, or null once it is gone. -->
  <script type="application/json" id="item-data">"%ITEM%"</script>
</head>
<main data-loading>
  <div id="page-loading" class="page-loading" role="status" aria-live="polite"><span class="loading-spinner" aria-hidden="true"></span><span>Loading item…</span></div>
  <h1 id="item-title">Shared item</h1>
  <p id="item-meta" class="intro"></p>

  <p id="status" class="status" role="status" aria-live="polite"></p>

  <section id="item" class="shared-item stack" aria-labelledby="item-title" hidden>
    <div id="item-body"></div>
    <p id="item-actions" class="actions"></p>
  </section>
</main>
