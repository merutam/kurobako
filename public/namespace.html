<head>
  <title>Kurobako</title>
  <script src="/access.js"></script>
  <script type="module" src="/namespace.js"></script>
  <!-- Filled in by the server: limits and rules, fixed for each deployment. -->
  <script type="application/json" id="config">"%CONFIG%"</script>
</head>
<main>
  <h1 id="page-title">Namespace</h1>
  <p class="intro">
    <span id="mode-label"></span><span id="expiry-label"></span><span id="page-links"></span>
  </p>

  <p id="status" class="status" role="status" aria-live="polite"></p>

  <dialog id="media-viewer" class="media-viewer" aria-labelledby="media-viewer-title">
    <div class="media-viewer-bar">
      <p>
        <strong id="media-viewer-title"></strong>
        <span id="media-viewer-count" class="hint"></span>
      </p>
      <form method="dialog">
        <button class="icon-button" data-icon="dismiss" type="submit" aria-label="Close the viewer" title="Close the viewer"></button>
      </form>
    </div>
    <div id="media-viewer-stage" class="media-viewer-stage">
      <div id="media-viewer-content" class="media-viewer-content" aria-live="polite"></div>
    </div>
  </dialog>

  <div class="columns">
    <section id="send-section" class="stack" aria-labelledby="send-title">
      <h2 id="send-title">Send</h2>

      <p class="send-options">
        <label class="checkbox-label">
          <input id="burn" name="burn" type="checkbox" />
          Delete after first open
        </label>
      </p>

      <form id="text-form">
        <fieldset>
          <legend id="text-legend">Text</legend>
          <textarea id="text" name="text" rows="8" aria-labelledby="text-legend" aria-describedby="text-limit" required></textarea>
          <p class="text-editor-options">
            <label for="text-language">Highlight</label>
            <select id="text-language" aria-label="Syntax highlighting">
              <option value="">Plain text</option>
            </select>
          </p>
          <p id="text-limit" class="hint"></p>
          <button data-icon="send" type="submit" class="primary">Send</button>
        </fieldset>
      </form>

      <form id="file-form">
        <fieldset>
          <legend id="file-legend">File</legend>
          <input id="file" class="visually-hidden" name="file" type="file" multiple aria-labelledby="file-legend" aria-describedby="file-limit" required />
          <label id="file-zone" class="dropzone" for="file">Drop files here, or click to pick them</label>
          <p id="file-limit" class="hint"></p>
          <button data-icon="send" type="submit" class="primary">Send</button>
        </fieldset>
      </form>
    </section>

    <section class="stack" aria-labelledby="queue-title">
      <div class="section-heading">
        <h2 id="queue-title">Items <small id="item-count"></small> <small id="live-status" class="live-status"></small> <small id="viewers" title="Pages open on this namespace right now, this one included"></small></h2>
        <button data-icon="refresh" id="refresh" type="button">Refresh</button>
      </div>
      <p class="list-options">
        <label for="expand-mode">Show contents</label>
        <select id="expand-mode">
          <option value="one">One at a time</option>
          <option value="several">Several at once</option>
          <option value="all">All</option>
        </select>
      </p>
      <ol id="items" class="items"></ol>
      <p id="empty" class="empty" hidden>No items.</p>
    </section>
  </div>

  <section class="page-section stack" aria-labelledby="qr-title">
    <h2 id="qr-title">Open on another device</h2>
    <img id="qr" class="qr-code" width="160" height="160" alt="QR code linking to this page" />
    <div class="copy-link">
      <input id="page-url" type="text" readonly aria-label="Link to this page" />
      <button data-icon="copy" id="copy-link" type="button">Copy link</button>
    </div>
  </section>

  <section id="lock-section" class="page-section stack" aria-labelledby="lock-title" hidden>
    <h2 id="lock-title">Lock</h2>
    <p id="lock-hint" class="hint"></p>
    <div id="lock-link-row" class="copy-link" hidden>
      <input id="lock-link" type="text" readonly aria-label="Link that writes here" />
      <button data-icon="copy" id="copy-lock-link" type="button">Copy link</button>
    </div>
    <form id="key-form" hidden>
      <label for="key-input">Write key</label>
      <div class="copy-link">
        <input id="key-input" type="text" autocomplete="off" spellcheck="false" required />
        <button data-icon="login" type="submit">Use key</button>
      </div>
    </form>
    <p class="actions">
      <button data-icon="lock" id="lock-button" type="button" hidden>Lock</button>
      <button data-icon="unlock" id="unlock-button" type="button" hidden>Unlock</button>
      <button data-icon="logout" id="forget-key" type="button" hidden>Forget the key here</button>
    </p>
  </section>

  <section class="page-section stack" aria-labelledby="backup-title">
    <h2 id="backup-title">Backup</h2>
    <p id="backup-hint" class="hint">
      Every item as a zip or a tar. Items that delete when opened are left out.
    </p>
    <p class="actions">
      <button data-icon="download" id="backup-zip" type="button">Download zip</button>
      <button data-icon="download" id="backup-tar" type="button">Download tar</button>
    </p>
    <form id="restore-form">
      <fieldset>
        <legend id="restore-legend">Restore</legend>
        <input
          id="restore-file"
          class="visually-hidden"
          type="file"
          accept=".zip,.tar,application/zip,application/x-tar"
          aria-labelledby="restore-legend"
          aria-describedby="restore-hint"
          required
        />
        <label id="restore-zone" class="dropzone" for="restore-file">
          Drop a backup here, or click to pick one
        </label>
        <p id="restore-hint" class="hint">
          A backup of a namespace (zip or tar); items already here are skipped.
        </p>
        <p class="actions">
          <button data-icon="upload" type="submit" class="primary">Restore</button>
        </p>
      </fieldset>
    </form>
  </section>
</main>
