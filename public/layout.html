<!--
  The frame of every page. The server fills it in once, at start: each page
  in public/ is a <head> with its own tags and a <main> with its content.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script src="/theme.js"></script>
    <script src="/scroll-top.js" defer></script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <!--%HEAD%-->
  </head>
  <body>
    <main%MAIN_ATTRIBUTES%>
      <header class="site-header">
        <p class="site-name">
          <a href="/"><img src="/logo.png" alt="" width="32" height="32" />Kurobako</a>
        </p>
        <div id="theme-picker"></div>
      </header>
      <!--%MAIN%-->
    </main>
    <footer class="site-footer">
      Kurobako %APP_VERSION% · <a href="/k/protocol">Protocol</a> ·
      <a href="/k/licenses">Licenses</a> ·
      <a class="external-link" href="https://github.com/merutam/kurobako" target="_blank" rel="noopener">Source</a>
    </footer>
    <button id="scroll-top" type="button" hidden>↑ Top</button>
  </body>
</html>
